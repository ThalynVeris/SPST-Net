# SPST-Net x2 evaluation configuration.
# Evaluation settings for the x2 SPST-Net checkpoint.

name: test_SPSTNet_x2
model_type: SPSTNetModel
scale: 2
num_gpu: 1
manual_seed: 3407

datasets:
  test_1:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/TestDataSR/HR/Set5/x2
    dataroot_lq: datasets/TestDataSR/LR/LRBI/Set5/x2
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_2:
    name: Set14
    type: PairedImageDataset
    dataroot_gt: datasets/TestDataSR/HR/Set14/x2
    dataroot_lq: datasets/TestDataSR/LR/LRBI/Set14/x2
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_3:
    name: B100
    type: PairedImageDataset
    dataroot_gt: datasets/TestDataSR/HR/B100/x2
    dataroot_lq: datasets/TestDataSR/LR/LRBI/B100/x2
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_4:
    name: Urban100
    type: PairedImageDataset
    dataroot_gt: datasets/TestDataSR/HR/Urban100/x2
    dataroot_lq: datasets/TestDataSR/LR/LRBI/Urban100/x2
    filename_tmpl: '{}'
    io_backend:
      type: disk

  test_5:
    name: Manga109
    type: PairedImageDataset
    dataroot_gt: datasets/TestDataSR/HR/Manga109/x2
    dataroot_lq: datasets/TestDataSR/LR/LRBI/Manga109/x2
    filename_tmpl: '{}'
    io_backend:
      type: disk

network_g:
  type: SPSTNet
  upscale: 2
  in_chans: 3
  window_size: 16
  overlap_ratio: 0.5

path:
  pretrain_network_g: pretrained_models/spst_net_x2.pth
  strict_load_g: true
  results_root: results/SPSTNet_x2

val:
  save_img: true
  suffix: SPSTNet

  metrics:
    psnr:
      type: calculate_psnr_pt
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim_pt
      crop_border: 2
      test_y_channel: true
